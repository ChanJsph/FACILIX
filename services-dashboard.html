<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Dashboard - FACILIX</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        .services-dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #0f2a47 0%, #1a3a57 100%);
            color: white;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }

        .dashboard-header p {
            margin: 0;
            color: #ccc;
        }

        .services-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .service-tab-btn {
            padding: 15px 25px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .service-tab-btn.active {
            color: #ffc107;
            border-bottom-color: #ffc107;
        }

        .service-tab-btn:hover {
            color: #0f2a47;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .available-services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }

        .service-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .service-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform: translateY(-6px);
            border-color: #ffc107;
        }

        .service-card.highlight {
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.35), 0 8px 24px rgba(0,0,0,0.15);
            animation: pulseHighlight 1.2s ease;
        }
        @keyframes pulseHighlight { 0%{box-shadow:0 0 0 0 rgba(255,193,7,0.5)} 100%{box-shadow:0 0 0 12px rgba(255,193,7,0)} }

        .service-card-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .service-card h3 {
            font-size: 20px;
            color: #0f2a47;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .service-card-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .service-price {
            font-size: 24px;
            font-weight: 700;
            color: #ffc107;
            margin-bottom: 15px;
        }

        .service-features {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f7fa;
            border-radius: 6px;
            line-height: 1.8;
        }

        .btn-request-service {
            width: 100%;
            padding: 12px;
            background: #0f2a47;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-request-service:hover {
            background: #1a3a57;
            box-shadow: 0 4px 12px rgba(15, 42, 71, 0.2);
        }

        .active-services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .active-service-card {
            background: white;
            border-left: 4px solid #4CAF50;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .active-service-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .active-service-title {
            font-weight: 700;
            color: #0f2a47;
            font-size: 16px;
        }

        .status-badge {
            background: #d1e7dd;
            color: #0a3622;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: #d1e7dd;
            color: #0a3622;
        }

        .status-badge.inactive {
            background: #f8d7da;
            color: #842029;
        }

        .service-info {
            font-size: 13px;
            color: #666;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .service-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: #f5f7fa;
            border-color: #ffc107;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 22px;
            color: #0f2a47;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
            margin-bottom: 25px;
        }

        .btn-primary-large {
            background: #ffc107;
            color: #0f2a47;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary-large:hover {
            background: #ffb300;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .service-history {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        .service-history h3 {
            font-size: 22px;
            color: #0f2a47;
            margin: 0 0 20px 0;
            font-weight: 700;
        }

        .history-item {
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-service-name {
            font-weight: 600;
            color: #0f2a47;
        }

        .history-date {
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .available-services-grid {
                grid-template-columns: 1fr;
            }

            .active-services-grid {
                grid-template-columns: 1fr;
            }

            .services-tabs {
                flex-direction: column;
                border-bottom: none;
            }

            .service-tab-btn {
                border-bottom: none;
                border-left: 3px solid transparent;
                justify-content: flex-start;
                padding-left: 0;
            }

            .service-tab-btn.active {
                border-left-color: #ffc107;
                border-bottom: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">⚙️</span>
                <span class="logo-text">FACILIX</span>
            </a>
            <nav class="navbar">
                <a href="index.html" class="nav-link">Home</a>
                <a href="services.html" class="nav-link active">Services</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <a href="requests.html" class="nav-link">Requests</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
            <div class="auth-buttons">
                <a href="register.html" class="register-btn">Register</a>
                <a href="login.html" class="login-btn">Login</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="services-dashboard-container">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <h1>🔧 My Services</h1>
            <p>Manage and request facility management services</p>
        </div>

        <!-- Tabs -->
        <div class="services-tabs">
            <button class="service-tab-btn active" onclick="switchTab('available')">📋 Available Services</button>
            <button class="service-tab-btn" onclick="switchTab('active')">✓ Active Services</button>
            <button class="service-tab-btn" onclick="switchTab('history')">📜 History</button>
        </div>

        <!-- Tab 1: Available Services -->
        <div id="available" class="tab-content active">
            <div class="available-services-grid" id="availableServicesGrid">
                <!-- Services will be loaded here -->
            </div>
        </div>

        <!-- Tab 2: Active Services -->
        <div id="active" class="tab-content">
            <div class="active-services-grid" id="activeServicesGrid">
                <!-- Active services will be loaded here -->
            </div>
        </div>

        <!-- Tab 3: History -->
        <div id="history" class="tab-content">
            <div class="service-history">
                <h3>Service Request History</h3>
                <div id="historyList">
                    <!-- History will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/script.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/nav.js"></script>
    <script>
        // Check if user is logged in
        window.addEventListener('load', async () => {
            let user = getCurrentUser();
            // Verify with server (SQLite) — if token invalid, fetchMe clears session
            try { const me = await window.facilixAuth.fetchMe(); if (me) user = me; } catch {}
            // Role check: allow all authenticated roles on this page (customize per page if needed)
            const allowed = ['superadmin','admin','technician','complainant'];
            if (user && !allowed.includes(user.role)) { alert('⛔ Role ' + user.role + ' not allowed here'); window.location.href='index.html'; return; }
            if (!user) {
                alert('❌ Please login to access this page');
                window.location.href = 'services.html';
                return;
            }
            loadServices();
        });

        // Complaint categories — 2-column cards
        const availableServices = [
            {
                id: 1,
                name: 'Fire Protection / DAS',
                icon: '🧯',
                description: 'Fire alarms, extinguishers, sprinklers, hydrants and DAS — inspection, testing and emergency repair',
                price: 'Contact for Quote',
                features: '• Fire alarm testing\n• Sprinkler & hydrant check\n• DAS signal audit'
            },
            {
                id: 2,
                name: 'Physical Structures',
                icon: '🏗️',
                description: 'Walls, ceilings, floors, doors, windows and structural elements — damage, cracks and carpentry',
                price: 'Contact for Quote',
                features: '• Wall/ceiling repair\n• Door/window fix\n• Painting & masonry'
            },
            {
                id: 3,
                name: 'Electrical',
                icon: '⚡',
                description: 'Lighting, outlets, panels, wiring and emergency lighting — faults, outages and safety checks',
                price: 'Contact for Quote',
                features: '• Lighting faults\n• Power & panel check\n• Safety inspection'
            },
            {
                id: 4,
                name: 'Mechanical',
                icon: '⚙️',
                description: 'Elevators, escalators, pumps, generators and mechanical rooms — upkeep and breakdown response',
                price: 'Contact for Quote',
                features: '• Elevator/escalator\n• Pump maintenance\n• Generator test'
            },
            {
                id: 5,
                name: 'Water / Sanitary / Fixtures',
                icon: '🚿',
                description: 'Leaks, clogging, faucets, toilets, sinks and fixtures — plumbing and drainage support',
                price: 'Contact for Quote',
                features: '• Leak & clog fix\n• Fixture replacement\n• Drainage clearance'
            },
            {
                id: 6,
                name: 'Air Conditioning',
                icon: '❄️',
                description: 'AC, HVAC, ventilation and cooling — cleaning, gas charging, thermostat and airflow',
                price: 'Contact for Quote',
                features: '• AC servicing\n• Filter cleaning\n• Gas & thermostat'
            }
        ];

        // Active services — linked to availableServices via availableId (2-column)
        const activeServices = [
            {
                id: 101,
                availableId: 1,
                name: 'Fire Protection / DAS',
                status: 'active',
                startDate: '2026-08-01',
                nextService: '2026-09-01',
                frequency: 'Monthly'
            },
            {
                id: 102,
                availableId: 6,
                name: 'Air Conditioning',
                status: 'active',
                startDate: '2026-06-15',
                nextService: '2026-08-20',
                frequency: 'Weekly'
            }
        ];

        // History — aligned to new complaint categories
        const serviceHistory = [
            { service: 'Fire Protection / DAS', date: '2026-08-10', status: 'Completed' },
            { service: 'Physical Structures', date: '2026-08-05', status: 'Completed' },
            { service: 'Air Conditioning', date: '2026-08-03', status: 'Completed' },
            { service: 'Electrical', date: '2026-07-28', status: 'Completed' },
            { service: 'Water / Sanitary / Fixtures', date: '2026-07-15', status: 'Completed' }
        ];

        // Load services
        function loadServices() {
            loadAvailableServices();
            loadActiveServices();
            loadHistory();
        }

        // Load available services — 2-column, each card linkable from Active
        function loadAvailableServices() {
            const grid = document.getElementById('availableServicesGrid');
            grid.innerHTML = availableServices.map(service => `
                <div class="service-card" id="available-service-${service.id}">
                    <div class="service-card-icon">${service.icon}</div>
                    <h3>${service.name}</h3>
                    <p class="service-card-description">${service.description}</p>
                    <div class="service-price">${service.price}</div>
                    <div class="service-features">${service.features.split('\n').join('<br>')}</div>
                    <button class="btn-request-service" onclick="requestService(${service.id}, '${service.name}')">
                        Request Service
                    </button>
                </div>
            `).join('');
        }

        // Load active services — each linked to its Available card; pause/cancel/change admin-only
        function loadActiveServices() {
            const grid = document.getElementById('activeServicesGrid');
            const curRole = (window.facilixAuth && window.facilixAuth.getRole && window.facilixAuth.getRole()) || (getCurrentUser()?.role) || '';
            const isAdmin = curRole === 'admin' || curRole === 'superadmin';
            if (activeServices.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No Active Services</h3>
                            <p>You don't have any active services yet. Request one from the available services!</p>
                            <button class="btn-primary-large" onclick="switchTab('available')">View Services</button>
                        </div>
                    </div>
                `;
            } else {
                grid.innerHTML = activeServices.map(service => {
                    const avail = availableServices.find(a => a.id === service.availableId);
                    const availName = avail ? avail.name : service.name;
                    const availIcon = avail ? avail.icon : '🔗';
                    const pauseBtn = isAdmin
                        ? `<button class="btn-small" onclick="pauseService(${service.id})">Pause</button>`
                        : `<span style="flex:1;text-align:center;padding:8px;color:#999;font-size:12px;border:1px dashed #ddd;border-radius:6px;">🔒 Pause — Admin only</span>`;
                    const cancelBtn = isAdmin
                        ? `<button class="btn-small" onclick="cancelService(${service.id})" style="color:#842029;border-color:#f8d7da;">Cancel</button>`
                        : ``;
                    return `
                    <div class="active-service-card">
                        <div class="active-service-header">
                            <div class="active-service-title">${service.name}</div>
                            <span class="status-badge active">Active</span>
                        </div>
                        <div style="margin:6px 0 10px;">
                            <a href="#" onclick="viewAvailableService(${service.availableId}); return false;" style="color:#0f2a47;font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">
                                <span>${availIcon}</span> View in Available: ${availName} →
                            </a>
                        </div>
                        <div class="service-info">
                            <span>📅 Started:</span>
                            <span>${service.startDate}</span>
                        </div>
                        <div class="service-info">
                            <span>⏰ Next Service:</span>
                            <span>${service.nextService}</span>
                        </div>
                        <div class="service-info">
                            <span>🔄 Frequency:</span>
                            <span>${service.frequency}</span>
                        </div>
                        <div class="service-actions">
                            <button class="btn-small" onclick="viewAvailableService(${service.availableId})">View Service</button>
                            ${pauseBtn}
                            ${cancelBtn}
                            <button class="btn-small" onclick="contactSupport(${service.id})">Support</button>
                        </div>
                    </div>
                `}).join('');
            }
        }

        // Load history
        function loadHistory() {
            const list = document.getElementById('historyList');
            if (serviceHistory.length === 0) {
                list.innerHTML = '<p style="color: #999; text-align: center;">No service history yet.</p>';
            } else {
                list.innerHTML = serviceHistory.map(item => `
                    <div class="history-item">
                        <div>
                            <div class="history-service-name">${item.service}</div>
                            <div class="history-date">${item.date}</div>
                        </div>
                        <span style="color: #4CAF50; font-weight: 600;">${item.status}</span>
                    </div>
                `).join('');
            }
        }

        // Switch tabs — robust for programmatic calls (no global event)
        function switchTab(tabName, clickedEl) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.service-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName)?.classList.add('active');
            const btn = clickedEl || (typeof event !== 'undefined' && event?.target?.closest?.('.service-tab-btn')) || document.querySelector(`.service-tab-btn[onclick*="'${tabName}'"]`);
            if (btn) btn.classList.add('active');
        }

        // Link Active → Available: switch tab, scroll and highlight
        function viewAvailableService(availableId) {
            switchTab('available');
            // wait for tab to show then scroll
            setTimeout(() => {
                const el = document.getElementById(`available-service-${availableId}`);
                if (!el) return;
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight');
                setTimeout(() => el.classList.remove('highlight'), 1800);
            }, 80);
        }

        // Request service — redirect to request form with pre-selected category
        function requestService(serviceId, serviceName) {
            window.location.href = `requests.html?service=${serviceId}&category=${encodeURIComponent(serviceName)}`;
        }

        // Pause / Cancel — admin only
        function pauseService(serviceId) {
            const role = (window.facilixAuth && window.facilixAuth.getRole && window.facilixAuth.getRole()) || (getCurrentUser()?.role) || '';
            if (role !== 'admin' && role !== 'superadmin') {
                alert('⛔ Only admin/superadmin can pause services. Your role: ' + role);
                return;
            }
            alert('⏸️ Service paused. You can resume it anytime from your dashboard.');
        }
        function cancelService(serviceId) {
            const role = (window.facilixAuth && window.facilixAuth.getRole && window.facilixAuth.getRole()) || (getCurrentUser()?.role) || '';
            if (role !== 'admin' && role !== 'superadmin') {
                alert('⛔ Only admin/superadmin can cancel services. Your role: ' + role);
                return;
            }
            if (confirm('Cancel this service? This will revoke the active service.')) {
                alert('🗑️ Service cancelled.');
            }
        }

        // Contact support
        function contactSupport(serviceId) {
            alert('📞 Support form coming soon!\n\nEmail: support@facilix.com\nPhone: 1-800-FACILIX');
        }
    </script>
</body>
</html>
