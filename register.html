<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FACILIX</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #ffffff 100%);
            padding: 40px 20px;
        }

        .register-form {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .register-form h2 {
            color: #0f2a47;
            margin-bottom: 30px;
            text-align: center;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #0f2a47;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffc107;
            box-shadow: 0 0 5px rgba(255, 193, 7, 0.3);
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .role-hint {
            color: #856404;
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.5;
        }

        .register-btn-submit {
            width: 100%;
            padding: 12px;
            background: #0f2a47;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .register-btn-submit:hover {
            background: #0f2a47;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #0f2a47;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #ffc107;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">⊕</span>
                <span class="logo-text">FACILIX</span>
            </a>
            <nav class="navbar">
                <a href="index.html" class="nav-link">Home</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <a href="requests.html" class="nav-link">Requests</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
            <div class="auth-buttons">
                <a href="register.html" class="register-btn">Register</a>
                <a href="login.html" class="login-btn">Login</a>
            </div>
        </div>
    </header>

    <!-- Register Form -->
    <div class="register-container">
        <form class="register-form">
            <h2>Create Account</h2>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="username">Username <small style="color:#666;font-weight:normal">(3-20 chars, a-z 0-9 . _ -)</small></label>
                <input type="text" id="username" name="username" placeholder="johndoe" pattern="[a-zA-Z0-9._-]{3,20}" title="3-20 characters, letters, numbers, dot, underscore, dash">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="register-btn-submit">Register</button>

            <div class="back-link">
                <p>Already have an account? <a href="login.html">Login here</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </form>
    </div>
    <script src="scripts/script.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/nav.js"></script>
    <script>
        // Handle registration via SQLite backend
        document.querySelector('.register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert('❌ Passwords do not match!');
                return;
            }
            if (password.length < 6) {
                alert('❌ Password must be at least 6 characters long!');
                return;
            }

            const btn = document.querySelector('.register-btn-submit');
            const orig = btn.textContent;
            btn.textContent = 'Creating...';
            btn.disabled = true;

            try {
                const headers = { 'Content-Type': 'application/json' };
                const token = localStorage.getItem('facilix_token');
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const payload = { fullname, email, password };
                if (username) payload.username = username;

                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    alert('❌ ' + (data.error || 'Registration failed'));
                    btn.textContent = orig;
                    btn.disabled = false;
                    return;
                }

                // Auto-login: backend returned token + user
                if (data.token && data.user) {
                    window.facilixAuth.setSession(data.token, data.user);
                } else if (data.user) {
                    // fallback: store safe user without token
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                }

                alert(`✅ Registered as ${data.user.role}! Welcome, ${data.user.fullname}`);
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } catch (err) {
                console.error(err);
                alert('❌ Network error — is Deno server running on :8000?');
                btn.textContent = orig;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
